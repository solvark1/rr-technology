services:

  mariadb:
    image: mariadb:10.11
    container_name: rr-mariadb
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: dolidb
      MYSQL_USER: dolibarr
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mariadb_data:/var/lib/mysql


  dolibarr:
    image: dolibarr/dolibarr:24.0.0
    container_name: rr-dolibarr
    restart: unless-stopped

    depends_on:
      - mariadb

    ports:
      - "8080:80"

    environment:

      # ==========================
      # Base de datos
      # ==========================

      DOLI_DB_HOST: mariadb
      DOLI_DB_NAME: dolidb
      DOLI_DB_USER: dolibarr
      DOLI_DB_PASSWORD: ${MYSQL_PASSWORD}

      # ==========================
      # Administrador
      # ==========================

      DOLI_ADMIN_LOGIN: admin
      DOLI_ADMIN_PASSWORD: ${DOLI_ADMIN_PASSWORD}

      # ==========================
      # Empresa
      # ==========================

      DOLI_COMPANY_NAME: "R&R Technology Costa Rica"
      DOLI_COMPANY_COUNTRYCODE: "CR"

      DOLI_URL_ROOT: "http://localhost:8080"

      # ==========================
      # Módulos
      # ==========================

      DOLI_ENABLE_MODULES: "Societe,Fournisseur,Product,Service,Stock,Bom,Mrp,Propale,Commande,Facture,Expedition,Reception,Agenda,Mailing,Accounting,Banque,HRM,Holiday,ExpenseReport,Website"

    volumes:

      # Archivos/documentos generados por Dolibarr
      - dolibarr_documents:/var/www/documents

      # Módulos desarrollados por nosotros
      - ./dolibarr-custom:/var/www/html/custom


volumes:

  # Base de datos persistente
  mariadb_data:

  # Documentos persistentes de Dolibarr
  dolibarr_documents: